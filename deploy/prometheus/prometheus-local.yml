# Prometheus config for the local (process-based) runtime.
# Targets are discovered from run/sd.json, written by deploy/local/supervisor.py.
global:
  scrape_interval: 2s
  evaluation_interval: 2s
rule_files:
  - alerts.yml
scrape_configs:
  - job_name: unidep
    file_sd_configs:
      - files: ["../../run/sd.json"]
        refresh_interval: 2s
