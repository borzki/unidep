groups:
  - name: unidep
    interval: 2s
    rules:
      - alert: ServiceInstanceDown
        expr: up == 0
        for: 4s
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.job }} instance {{ $labels.instance }} is not responding to scrapes"

      - alert: HighGatewayErrorRate
        expr: |
          sum(rate(http_requests_total{service="gateway",status=~"5.."}[15s]))
            / clamp_min(sum(rate(http_requests_total{service="gateway"}[15s])), 0.001) > 0.05
        for: 4s
        labels: {severity: critical}
        annotations:
          summary: "More than 5% of gateway requests fail with 5xx"

      - alert: CircuitBreakerOpen
        expr: max by (service, target) (circuit_breaker_state) == 2
        for: 0s
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.service }} opened its circuit to {{ $labels.target }}"

      - alert: HighEnrollmentLatencyP95
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{service="gateway",route="proxy:enrollment"}[15s]))) > 1
        for: 4s
        labels: {severity: warning}
        annotations:
          summary: "p95 enrollment latency above 1 s (SLO)"

      - alert: SecurityDenialSpike
        expr: sum(increase(security_events_total[30s])) > 10
        for: 0s
        labels: {severity: warning}
        annotations:
          summary: "Burst of denied/suspicious operations (possible misuse)"

      - alert: StuckPendingEnrollments
        expr: sum(increase(enrollments_total{outcome="dependency_unavailable"}[30s])) > 0
        for: 0s
        labels: {severity: info}
        annotations:
          summary: "Enrollments left PENDING because a dependency was unavailable"

      - alert: InstanceRestarted
        expr: changes(process_start_time_seconds[20s]) > 0
        for: 0s
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.job }} {{ $labels.instance }} restarted (crash detected, self-healed)"
